name: Required Checks

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

concurrency:
  group: required-${{ github.ref }}
  cancel-in-progress: true

jobs:

  forbid-suppressions:
    name: forbid-suppressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Reject silent-failure suppressions
        run: python3 ci/checks.py forbid-suppressions

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-telemachy-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-telemachy-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t telemachy-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-lint`.
      - name: lint (in container)
        run: bash scripts/run_ci_local.sh lint

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-telemachy-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-telemachy-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t telemachy-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-markdownlint`.
      - name: markdownlint (in container)
        run: bash scripts/run_ci_local.sh markdownlint

  pixi-check:
    name: pixi-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-telemachy-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-telemachy-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t telemachy-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-pixi-check`.
      - name: pixi-check (in container)
        run: bash scripts/run_ci_local.sh pixi-check

  justfile-check:
    name: justfile-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-telemachy-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-telemachy-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t telemachy-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-justfile-check`.
      - name: justfile-check (in container)
        run: bash scripts/run_ci_local.sh justfile-check

  symlink-check:
    name: symlink-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-telemachy-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-telemachy-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t telemachy-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-symlink-check`.
      - name: symlink-check (in container)
        run: bash scripts/run_ci_local.sh symlink-check

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-telemachy-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-telemachy-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t telemachy-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-unit-tests`.
      - name: unit-tests (in container)
        run: bash scripts/run_ci_local.sh unit-tests

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-telemachy-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-telemachy-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t telemachy-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-integration-tests`.
      - name: integration-tests (in container)
        run: bash scripts/run_ci_local.sh integration-tests

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [unit-tests, integration-tests]
    permissions:
      contents: read
    steps:
      - name: Aggregate test gate
        run: |
          echo "All test suites (unit-tests, integration-tests) passed."
          echo "This canonical 'test' check aggregates the split suites for the ecosystem board."

  security-dependency-scan:
    name: security/dependency-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # trivy SARIF upload needs code-scanning write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-telemachy-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-telemachy-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t telemachy-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-security-dependency-scan`.
      - name: security-dependency-scan (in container)
        run: bash scripts/run_ci_local.sh security-dependency-scan

  security-secrets-scan:
    name: security/secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # gitleaks SARIF upload needs code-scanning write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-telemachy-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-telemachy-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t telemachy-ci:local .
      - name: Run Gitleaks
        run: bash scripts/run_ci_local.sh security-secrets-scan

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v3
        with:
          sarif_file: gitleaks.sarif

  security-sast-scan:
    name: security/sast-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.70.2
          cache: true
      - name: Run Bandit SAST scan (medium+ severity, emit JSON report)
        run: python3 ci/checks.py security-sast-scan
      - name: Upload Bandit JSON report
        if: always() && hashFiles('bandit.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          path: bandit.json
          retention-days: 90

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.70.2
          cache: true
      - name: Build distribution (hatchling)
        run: python3 ci/checks.py build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telemachy-dist-ci
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.70.2
          cache: true
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: telemachy-dist-ci
          path: dist/
      - name: Validate distribution metadata (twine check)
        run: python3 ci/checks.py package

  install:
    name: install
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.70.2
          cache: true
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: telemachy-dist-ci
          path: dist/
      - name: Install wheel in a clean venv and smoke-test
        run: python3 ci/checks.py install

  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.70.2
          cache: true
      - name: Release dry-run (validate changelog + version contract, NO publish)
        run: python3 ci/checks.py release

  schema-validation:
    name: schema-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-telemachy-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-telemachy-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t telemachy-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-schema-validation`.
      - name: schema-validation (in container)
        run: bash scripts/run_ci_local.sh schema-validation

  deps-version-sync:
    name: deps/version-sync
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-telemachy-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-telemachy-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t telemachy-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-deps-version-sync`.
      - name: deps-version-sync (in container)
        run: bash scripts/run_ci_local.sh deps-version-sync
