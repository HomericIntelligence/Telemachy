name: Required Checks

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  merge_group:
    types: [checks_requested]

concurrency:
  group: required-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

# Every required check executes inside the Telemachy CI image that AchaeanFleet
# publishes; no job installs a toolchain on the runner. The image is a private
# package because organization policy forbids public container packages, so
# this credential is declared once here instead of repeated in each job.
env:
  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
  GHCR_ACTOR: ${{ github.actor }}

jobs:

  forbid-suppressions:
    name: forbid-suppressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: forbid-suppressions (in container)
        run: bash scripts/run_ci_local.sh forbid-suppressions

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: lint (in container)
        run: bash scripts/run_ci_local.sh lint

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: markdownlint (in container)
        run: bash scripts/run_ci_local.sh markdownlint

  pixi-check:
    name: pixi-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: pixi-check (in container)
        run: bash scripts/run_ci_local.sh pixi-check

  justfile-check:
    name: justfile-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: justfile-check (in container)
        run: bash scripts/run_ci_local.sh justfile-check

  symlink-check:
    name: symlink-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: symlink-check (in container)
        run: bash scripts/run_ci_local.sh symlink-check

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: unit-tests (in container)
        run: bash scripts/run_ci_local.sh unit-tests

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: integration-tests (in container)
        run: bash scripts/run_ci_local.sh integration-tests

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [unit-tests, integration-tests]
    permissions:
      contents: read
    steps:
      - name: Aggregate test gate
        run: |
          echo "All test suites (unit-tests, integration-tests) passed."
          echo "This canonical 'test' check aggregates the split suites for the ecosystem board."

  security-dependency-scan:
    name: security/dependency-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write  # trivy SARIF upload needs code-scanning write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: security-dependency-scan (in container)
        run: bash scripts/run_ci_local.sh security-dependency-scan

  security-secrets-scan:
    name: security/secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write  # gitleaks SARIF upload needs code-scanning write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: bash scripts/run_ci_local.sh security-secrets-scan

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v3
        with:
          sarif_file: gitleaks.sarif

  security-sast-scan:
    name: security/sast-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: security/sast-scan (in container)
        run: bash scripts/run_ci_local.sh security-sast-scan

      - name: Upload Bandit JSON report
        if: always() && hashFiles('bandit.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bandit-report
          path: bandit.json
          retention-days: 90

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: build (in container)
        run: bash scripts/run_ci_local.sh build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telemachy-dist-ci
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: telemachy-dist-ci
          path: dist/

      - name: package (in container)
        run: bash scripts/run_ci_local.sh package

  install:
    name: install
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: telemachy-dist-ci
          path: dist/

      - name: install (in container)
        run: bash scripts/run_ci_local.sh install

  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: release dry-run (in container)
        run: bash scripts/run_ci_local.sh release

  schema-validation:
    name: schema-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: schema-validation (in container)
        run: bash scripts/run_ci_local.sh schema-validation

  deps-version-sync:
    name: deps/version-sync
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: deps/version-sync (in container)
        run: bash scripts/run_ci_local.sh deps-version-sync
