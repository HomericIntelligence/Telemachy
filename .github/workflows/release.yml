name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

# Release verification and building execute in the same fleet CI image as the
# required checks, so a tagged build uses the toolchain that passed the queue.
env:
  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
  GHCR_ACTOR: ${{ github.actor }}

jobs:
  verify-version:
    name: verify-version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Resolve target version from tag
        id: resolve
        run: |
          set -euo pipefail
          ref="${GITHUB_REF#refs/tags/v}"
          echo "version=${ref}" >> "$GITHUB_OUTPUT"
          echo "Target release version: ${ref}"
      - name: Cross-check tag against pyproject.toml, __init__.py, and CHANGELOG (in container)
        env:
          TARGET: ${{ steps.resolve.outputs.version }}
        run: bash scripts/container_run.sh python3 ci/package_check.py release --tag "${TARGET}"

  build:
    name: build
    runs-on: ubuntu-24.04
    needs: verify-version
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build sdist and wheel (in container)
        run: bash scripts/run_ci_local.sh build
      - name: List built artifacts
        run: ls -la dist/
      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telemachy-dist-${{ needs.verify-version.outputs.version }}
          path: dist/*
          retention-days: 90
          if-no-files-found: error

  github-release:
    name: github-release
    runs-on: ubuntu-24.04
    needs: [verify-version, build]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: telemachy-dist-${{ needs.verify-version.outputs.version }}
          path: dist/
      - name: Extract changelog section for this version
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY' > release-notes.md
          import os, pathlib, re, sys
          ver = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text()
          pat = re.compile(
              rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          m = pat.search(text)
          if not m:
              sys.stderr.write(f"No CHANGELOG entry found for [{ver}]\n")
              sys.exit(1)
          sys.stdout.write(m.group(1).strip() + "\n")
          PY
      - name: Create GitHub Release with attached artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.verify-version.outputs.version }}
          name: v${{ needs.verify-version.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

  pypi-publish:
    name: pypi-publish
    runs-on: ubuntu-24.04
    needs: [verify-version, build]
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: telemachy-dist-${{ needs.verify-version.outputs.version }}
          path: dist/
      - name: Publish to PyPI via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: false
