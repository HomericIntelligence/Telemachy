name: Merge Queue Smoke

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  packages: read

# The smoke gate runs in the same image as the required checks, so it carries
# the same pull credential and no runner-installed tooling.
env:
  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
  GHCR_ACTOR: ${{ github.actor }}

concurrency:
  group: mq-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-queue-smoke:
    name: merge-queue-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Merge-queue readiness (in container)
        # Validates the workflow YAML against the vendored GitHub-workflows
        # schema, lints it, and runs the merge-queue contract tests.
        run: bash scripts/run_ci_local.sh merge-queue-smoke
