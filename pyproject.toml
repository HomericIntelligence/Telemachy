[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telemachy"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "nats-py>=2.7",
]

[project.scripts]
telemachy = "telemachy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telemachy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests exercising WorkflowExecutor against a mock Agamemnon HTTP server (respx)",
]

[tool.coverage.run]
source = ["telemachy"]

[tool.coverage.report]
fail_under = 75

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["telemachy"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
