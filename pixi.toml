[workspace]
name = "project-telemachy"
version = "0.2.0"
description = "Declarative workflow engine for ProjectAgamemnon multi-agent workflows"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.13,<3.14"

[pypi-dependencies]
telemachy         = { path = ".", editable = true }
pydantic          = ">=2.0"
pydantic-settings = ">=2.0"
httpx             = ">=0.27"
pyyaml            = ">=6.0"
rich              = ">=13.0"
typer                            = ">=0.12"
prometheus-client                = ">=0.20"
opentelemetry-api                = ">=1.25"
opentelemetry-sdk                = ">=1.25"
opentelemetry-instrumentation-httpx = ">=0.46b0"
mcp                                 = ">=1.0,<2.0"
cryptography                    = ">=50"
nats-py                          = ">=2.7"

[tasks]
run             = "bash -c 'just run \"$@\"' --"
test            = "just test"
lint            = "just lint"
format          = "just format"
bandit          = "bandit -ll --ini .bandit -r src/telemachy"
license-audit   = "python -c \"import tomllib, pathlib; data = tomllib.loads(pathlib.Path('pixi.toml').read_text()); deps = data.get('pypi-dependencies', {}); print('Runtime [pypi-dependencies] (cross-check against docs/license-audit.md):'); [print(f'  {k} = {v!r}') for k, v in deps.items() if k != 'telemachy']\""

[feature.dev.pypi-dependencies]
pytest          = ">=8.0"
pytest-asyncio  = ">=0.23"
pytest-cov      = ">=5.0"
ruff            = ">=0.4"
mypy            = ">=1.10"
types-PyYAML    = ">=6.0"
yamllint        = ">=1.26"
respx           = ">=0.21"
bandit          = ">=1.7.5"

[environments]
default = { features = ["dev"], solve-group = "default" }
